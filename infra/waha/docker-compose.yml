# Local WAHA (WhatsApp HTTP API) — Core image (free).
# Docs: https://waha.devlike.pro/docs/how-to/install/
# Use `waha-plus` only if you have a DevLikePro license.
services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"
    # Host 3080 avoids clashing with the Vite app (port 3000). Container still listens on 3000.
    ports:
      - "127.0.0.1:3080:3000"
    volumes:
      - ./sessions:/app/.sessions
      - ./media:/app/.media
    env_file:
      - .env
